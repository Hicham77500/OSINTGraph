services:
  api:
    build: ./backend
    volumes:
      - osintgraph_data:/data
    environment:
      SQLITE_PATH: /data/osintgraph.db
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost}
      OSINTGRAPH_AUTH_DISABLED: ${OSINTGRAPH_AUTH_DISABLED:-false}
      OSINTGRAPH_SESSION_SECRET: ${OSINTGRAPH_SESSION_SECRET:-change-me}
      TRANSFORM_RATE_LIMIT: ${TRANSFORM_RATE_LIMIT:-30}
      AI_READINESS_THRESHOLD: ${AI_READINESS_THRESHOLD:-60}
      AI_PROVIDER: ${AI_PROVIDER:-rule-based}
      AI_API_KEY: ${AI_API_KEY:-}
      SHODAN_API_KEY: ${SHODAN_API_KEY:-}
      HIBP_API_KEY: ${HIBP_API_KEY:-}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  web:
    build: ./frontend
    ports:
      - "${OSINTGRAPH_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  osintgraph_data:
